<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa de Pontos</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <!-- Cluster -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />

  <!-- Seu CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Abas -->
<div class="top-tabs">
  <a href="#" class="tab active">Mapa pontos de votação</a>
</div>

<!-- Mapa -->
<div id="map"></div>

<!-- Botões -->
<div class="loc-btn" onclick="goToLocation()">📍</div>
<div class="coord-btn" onclick="toggleCoordMode()">📌</div>

<!-- Filtro de Cidades -->
<div class="city-filter">
  <h4>Filtrar por Cidade</h4>
  <label><input type="checkbox" class="city-checkbox" value="NATAL" checked>NATAL</label>
  <label><input type="checkbox" class="city-checkbox" value="PARNAMIRIM" checked>PARNAMIRIM</label>
  <label><input type="checkbox" class="city-checkbox" value="MACAIBA" checked> MACAIBA</label>
  <label><input type="checkbox" class="city-checkbox" value="SÃO JOSE DE MIPIBU" checked>SÃO JOSE DE MIPIBU</label>
  <label><input type="checkbox" class="city-checkbox" value="VERA CRUZ" checked>VERA CRUZ</label>
  <label><input type="checkbox" class="city-checkbox" value="MONTE ALEGRE" checked>MONTE ALEGRE</label>
  <label><input type="checkbox" class="city-checkbox" value="NISIA FLORESTA" checked>NISIA FLORESTA</label>
  <label><input type="checkbox" class="city-checkbox" value="SENADOR GEORGINO AVELINO" checked>SENADOR GEORGINO AVELINO</label>
</div>

<!-- Scripts -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

<!-- PapaParse -->
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

<!-- Seu script -->
<script src="script.js"></script>

</body>
</html>
